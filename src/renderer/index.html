<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>Laptop Inventory Manager</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/dashboard.css">
  <link rel="stylesheet" href="styles/inventory.css">
  <link rel="stylesheet" href="styles/backup.css">
  <link rel="stylesheet" href="styles/settings.css">
  <link rel="stylesheet" href="styles/ledger.css">
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
        </div>
        <h2>Inventory Manager</h2>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-item active" data-page="dashboard" onclick="App.navigate('dashboard')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
          </svg>
          <span>Dashboard</span>
        </button>
        <button class="nav-item" data-page="inventory" onclick="App.navigate('inventory')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
          </svg>
          <span>Inventory</span>
        </button>
        <button class="nav-item" data-page="customers" onclick="App.navigate('customers')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          <span>Customers</span>
        </button>
        <button class="nav-item" data-page="sales-history" onclick="App.navigate('sales-history')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          <span>Sales History</span>
        </button>
        <button class="nav-item" data-page="create-sale" onclick="App.navigate('create-sale')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          <span>New Sale / Issue</span>
        </button>
        <button class="nav-item" data-page="ledgers" onclick="App.navigate('ledgers')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>
          </svg>
          <span>Ledgers</span>
        </button>
        <button class="nav-item" data-page="returns" onclick="App.navigate('returns')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
          </svg>
          <span>Returns</span>
        </button>
        <button class="nav-item" data-page="expenses" onclick="App.navigate('expenses')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
          <span>Expenses</span>
        </button>
        <button class="nav-item" data-page="suppliers" onclick="App.navigate('suppliers')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>
          </svg>
          <span>Suppliers</span>
        </button>
        <button class="nav-item" data-page="cashbook" onclick="App.navigate('cashbook')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          </svg>
          <span>Cash &amp; Bank Book</span>
        </button>
        <button class="nav-item" data-page="backup" onclick="App.navigate('backup')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
          </svg>
          <span>Backup & Restore</span>
        </button>
        <button class="nav-item" data-page="settings" onclick="App.navigate('settings')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          <span>Settings</span>
        </button>
      </nav>
      <div class="sidebar-footer">
        <button class="btn btn-secondary btn-sm" style="width:100%;margin-bottom:8px;" onclick="LoginPage.logout()">Sign out</button>
        <span class="version">v1.0.0</span>
        <span class="developer-credit">Developed by Muhammad Zaid - 03189230490</span>
      </div>
    </aside>

    <!-- Main Content -->
    <main id="main-content">
      <!-- Top Bar -->
      <header id="topbar">
        <div class="topbar-left">
          <div id="shop-name">Laptop Inventory Manager</div>
        </div>
        <div id="global-search-root" class="global-search-root">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="global-search-input" type="search" placeholder="Search products, serials, customers, invoices…" autocomplete="off" oninput="GlobalSearch.onInput()" onkeydown="GlobalSearch.onKeydown(event)">
          <div id="global-search-results" class="global-search-results" style="display:none;"></div>
        </div>
        <div class="topbar-right">
          <div class="owner-context" title="Single owner account"><span class="owner-avatar">O</span><span>Owner</span></div>
          <div id="task-center-root" class="task-center-root">
            <button id="task-center-toggle" class="task-center-toggle" onclick="TaskCenter.toggle()" aria-expanded="false" aria-controls="task-center-panel">
              <span>Tasks</span><span id="task-center-count" class="task-center-count" style="display:none;">0</span>
            </button>
            <section id="task-center-panel" class="task-center-panel" style="display:none;" aria-label="Background tasks"></section>
          </div>
          <button id="lang-toggle" data-no-i18n class="btn btn-secondary btn-sm" style="margin-right:8px;margin-left:8px;" onclick="I18n.toggle()" title="Language / زبان">اردو</button>
          <button id="cost-toggle" class="btn btn-secondary btn-sm" style="margin-right:12px;" onclick="App.toggleCost()">Show Purchase Prices</button>
          <div class="theme-toggle">
            <button onclick="App.toggleTheme()" title="Toggle Theme">
              <svg class="theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
              </svg>
              <svg class="theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
              </svg>
            </button>
          </div>
        </div>
      </header>

      <!-- Page Content -->
      <div id="page-content">
        <!-- Pages will be loaded here -->
      </div>
    </main>
  </div>

  <div id="login-screen" style="display:none;"></div>

  <!-- Modal Container -->
  <div id="modal-overlay" class="modal-overlay" style="display:none;">
    <div id="modal-content" class="modal-content"></div>
  </div>

  <!-- Toast/Notification Container -->
  <div id="toast-container"></div>

  <!-- Scripts - IMPORTANT: Load order matters -->
  <!-- 1. Utilities (no dependencies) -->
  <script src="../shared/ur.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/compact.js"></script>
  <script src="../shared/saleMath.js"></script>
  <script src="utils/formatters.js"></script>
  <script src="utils/validators.js"></script>
  <script src="utils/shopInfo.js"></script>
  <script src="utils/reportTheme.js"></script>
  <script src="utils/printService.js"></script>
  
  <!-- 2. Components (depend on utilities) -->
  <script src="i18n.js"></script>
  <script src="components/Toast.js"></script>
  <script src="components/Modal.js"></script>
  <script src="components/SuperPrompt.js"></script>
  <script src="components/Pagination.js"></script>
  <script src="components/Table.js"></script>
  <script src="components/Busy.js"></script>
  <script src="components/WhatsAppLink.js"></script>
  <script src="components/BulkShare.js"></script>
  <script src="components/GlobalSearch.js"></script>
  <script src="components/TaskCenter.js"></script>
  
  <!-- 3. Pages (depend on components + utilities) -->
  <script src="pages/login.js"></script>
  <script src="pages/vendor.js"></script>
  <script src="pages/expenses.js"></script>
  <script src="pages/suppliers.js"></script>
  <script src="pages/cashBook.js"></script>
  <script src="pages/dashboard.js"></script>
  <script src="pages/inventory.js"></script>
  <script src="pages/backup.js"></script>
  <script src="pages/settings.js"></script>
  <!-- Ledger Module Pages -->
  <script src="pages/customers.js"></script>
  <script src="pages/sales.js"></script>
  <script src="pages/salesHistory.js"></script>
  <script src="pages/ledgers.js"></script>
  <script src="pages/oldBalances.js"></script>
  <script src="pages/returns.js"></script>
  <script src="pages/reports.js"></script>
  
  <!-- 4. App controller (depends on everything) -->
  <script src="app.js"></script>
</body>
</html>
